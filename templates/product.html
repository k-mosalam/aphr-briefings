<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <link rel="stylesheet" href="../../../../assets/css/site.css?v={{ site_css_version }}">
  <link rel="stylesheet" href="../../../../assets/css/report.css?v=20260815-closure">
</head>
<body class="page-product">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  {{ topbar }}
  {{ content_drawer }}
  <div class="site-shell">
    <main class="site-main" id="main-content">
      <header class="report-header" id="product-overview">
        {{ product_heading }}
        <div class="header-times">
          {{ product_meta }}
        </div>
      </header>

      <div class="report-container">
        {{ content_html }}
      </div>

      <footer class="site-footer">
        Khalid M. Mosalam and Guanren Zhou · University of California, Berkeley
      </footer>
    </main>
  </div>
  <script src="../../../../assets/js/site.js?v=20260815-closure"></script>
  <script src="../../../../assets/js/report.js?v=20260815-closure"></script>
  <script src="../../../../assets/js/citations.js?v=20260815-closure"></script>{{ review_script }}
</body>
</html>
